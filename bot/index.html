<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABDOLLAH VIDEO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080914;color:white;font-family:Tahoma}
header{background:#15172b;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:20px;font-weight:bold;color:#a78bfa}
.logo span{color:#20d9ff}
button{border:0;padding:11px 15px;border-radius:9px;background:#805cff;color:white;cursor:pointer}
main{width:92%;max-width:950px;margin:25px auto}
.hero{background:linear-gradient(120deg,#30205e,#111c38);padding:30px 15px;border-radius:18px;text-align:center}
.box{background:#15172b;padding:20px;border-radius:15px;margin-top:20px}
input,textarea,select{width:100%;padding:13px;margin:8px 0;background:#090b18;color:white;border:1px solid #393957;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:20px}
.post{background:#15172b;border-radius:13px;overflow:hidden}
.post img,.post video{width:100%;max-height:300px;object-fit:contain;background:#000}
.info{padding:14px}
.info p{color:#bbb;line-height:1.8;overflow-wrap:anywhere}
.actions{display:flex;gap:8px}
.search{margin-top:20px}
#status{color:#20d9ff}
</style>
</head>
<body>

<header>
<div class="logo">▶ ABDOLLAH <span>VIDEO</span></div>
<button onclick="document.getElementById('publish').scrollIntoView()">＋ انتشار</button>
</header>

<main>
<section class="hero">
<h1>دنیای اشتراک‌گذاری ویدئو</h1>
<p>عکس و ویدئوی خودت را با لینک منتشر کن!</p>
</section>

<section class="box" id="publish">
<h2>انتشار پست جدید</h2>

<input id="title" placeholder="عنوان پست">

<textarea id="description" placeholder="توضیحات..."></textarea>

<select id="type">
<option value="video">ویدئو</option>
<option value="image">عکس</option>
</select>

<input id="url" type="url" placeholder="لینک مستقیم عکس یا ویدئو">

<button onclick="publish()">انتشار پست</button>
<p id="status"></p>
</section>

<input class="search" id="search" placeholder="جست‌وجوی پست..." oninput="render()">

<h2>آخرین انتشارها</h2>
<div class="grid" id="posts"></div>
</main>

<script>
let data=JSON.parse(localStorage.getItem("abdollah_posts")||"[]");

function publish(){
 const title=document.getElementById("title").value.trim();
 const description=document.getElementById("description").value.trim();
 const url=document.getElementById("url").value.trim();
 const type=document.getElementById("type").value;

 try{
  const parsed=new URL(url);
  if(!["https:","http:"].includes(parsed.protocol)) throw 0;
 }catch{
  document.getElementById("status").innerText="لینک معتبر وارد کن.";
  return;
 }

 if(!title){
  document.getElementById("status").innerText="عنوان را وارد کن.";
  return;
 }

 data.unshift({
  id:Date.now(),
  title,description,url,type,likes:0
 });

 save();
 document.getElementById("title").value="";
 document.getElementById("description").value="";
 document.getElementById("url").value="";
 document.getElementById("status").innerText="پست ثبت شد.";
 render();
}

function save(){
 localStorage.setItem("abdollah_posts",JSON.stringify(data));
}

function like(id){
 const post=data.find(x=>x.id===id);
 if(post){post.likes++;save();render();}
}

function removePost(id){
 if(!confirm("این پست حذف شود؟"))return;
 data=data.filter(x=>x.id!==id);
 save();
 render();
}

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const area=document.getElementById("posts");
 area.innerHTML="";

 data.filter(x=>(x.title+" "+x.description).toLowerCase().includes(q))
 .forEach(x=>{
  const card=document.createElement("article");
  card.className="post";

  let media;
  if(x.type==="image"){
   media=document.createElement("img");
   media.src=x.url;
   media.alt=x.title;
  }else{
   media=document.createElement("video");
   media.src=x.url;
   media.controls=true;
   media.playsInline=true;
   media.preload="metadata";
  }

  const info=document.createElement("div");
  info.className="info";

  const heading=document.createElement("h3");
  heading.textContent=x.title;

  const desc=document.createElement("p");
  desc.textContent=x.description;

  const actions=document.createElement("div");
  actions.className="actions";

  const likeBtn=document.createElement("button");
  likeBtn.textContent="❤️ "+x.likes;
  likeBtn.onclick=()=>like(x.id);

  const deleteBtn=document.createElement("button");
  deleteBtn.textContent="حذف";
  deleteBtn.onclick=()=>removePost(x.id);

  actions.append(likeBtn,deleteBtn);
  info.append(heading,desc,actions);
  card.append(media,info);
  area.append(card);
 });
}

render();
</script>
</body>
</html>
