<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080817">

<title>عبدالله ظاهری</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080817;
    color: white;
    font-family: Vazirmatn, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
}

.card {
    width: 100%;
    max-width: 620px;
    min-height: 870px;
    background: #100f20;
    border: 1px solid #302b4b;
    border-radius: 40px;
    padding: 45px 25px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 20px 60px #0008;
}

.profile {
    width: 290px;
    height: 290px;
    max-width: 75vw;
    max-height: 75vw;
    object-fit: cover;
    border-radius: 50%;
    padding: 7px;
    border: 4px solid #7955d9;
    box-shadow: 0 0 35px #7955d955;
    margin-bottom: 65px;
}

h1 {
    font-size: clamp(35px, 7vw, 54px);
    font-weight: 800;
    background: linear-gradient(90deg,#8c78d9,#25b9d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 55px;
}

.line {
    width: 122px;
    height: 7px;
    border-radius: 20px;
    background: linear-gradient(90deg,#6846bd,#159db4);
    margin-bottom: 45px;
}

.description {
    color: #858296;
    font-size: 21px;
    line-height: 2.5;
}

.footer {
    margin-top: auto;
    padding-top: 60px;
    color: #625f70;
    font-size: 17px;
}

@media(max-width:480px) {
    .card {
        min-height: 850px;
        padding: 38px 20px;
    }

    .profile {
        margin-bottom: 52px;
    }

    h1 {
        margin-bottom: 38px;
    }

    .description {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="card">

    <img
        class="profile"
        src="https://s101.picofile.com/d/kiC7l-H8giBt2fUN4VzUM6rUwruNRRhrLwKjM-AD1Q-nspcA2mbDfVvzRhSCKF-lnVJm-VfdSxSxEXcOyZRXXDOsurU9LsTXgny-/IMG_20250818_114602.jpg"
        alt="عکس عبدالله ظاهری">

    <h1>عبدالله ظاهری</h1>

    <div class="line"></div>

    <p class="description">
        ❤️ سلام! خوش آمدید
        <br>
        این صفحه شخصی من است.
        <br>
        به دنیای من خوش آمدید.
    </p>

    <div class="footer">
        © 2026 عبدالله ظاهری
    </div>

</div>

</body>
</html>
