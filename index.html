<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عبدالله ظاهری</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Vazirmatn, sans-serif;
    background: #080817;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #15152c;
    border: 1px solid #39335f;
    border-radius: 25px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 15px 50px #0008;
}

.profile {
    width: 165px;
    height: 165px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #9470ff;
    box-shadow: 0 0 30px #7955ff80;
    margin-bottom: 25px;
}

h1 {
    font-size: 32px;
    background: linear-gradient(90deg,#a78bfa,#22d3ee);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 15px;
}

p {
    color: #b9b9ce;
    line-height: 2.3;
    font-size: 14px;
}

.line {
    width: 70px;
    height: 4px;
    background: linear-gradient(90deg,#7955ff,#22d3ee);
    border-radius: 10px;
    margin: 25px auto;
}

.footer {
    color: #777;
    font-size: 12px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="card">

    <img
    class="profile"
    src="https://s101.picofile.com/d/kiC7l-H8giBt2fUN4VzUM6rUwruNRRhrLwKjM-AD1Q-nspcA2mbDfVvzRhSCKF-lnVJm-VfdSxSxEXcOyZRXXDOsurU9LsTXgny-/IMG_20250818_114602.jpg"
    alt="عبدالله ظاهری">

    <h1>عبدالله ظاهری</h1>

    <div class="line"></div>

    <p>
        سلام! خوش آمدید ❤️
        <br>
        این صفحه شخصی من است.
        <br>
        به دنیای من خوش آمدید.
    </p>

    <div class="footer">
        © 2026 عبدالله ظاهری
    </div>

</div>

</body>
</html>
